services:
  - type: web
    name: surge-backend
    runtime: node
    rootDir: backend
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false  # Set this manually in dashboard
    healthCheckPath: /health
